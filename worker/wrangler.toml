name = "babywegweiser-counter"
main = "counter.js"
compatibility_date = "2024-01-01"

# Created by `wrangler kv namespace create COUNTER` — paste the id it prints.
kv_namespaces = [
  { binding = "COUNTER", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

[vars]
# The exact origin your site is served from — no path, no trailing slash.
ALLOWED_ORIGIN = "https://YOUR-USERNAME.github.io"
