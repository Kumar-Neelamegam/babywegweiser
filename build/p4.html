const SKEY="bw_v1";
let mem={}, canStore=true;

function defaultLang(){
  const n=((navigator.languages&&navigator.languages[0])||navigator.language||"de").toLowerCase();
  if(n.startsWith("de")) return "de";
  if(n.startsWith("tr")) return "tr";
  if(n.startsWith("ro")||n.startsWith("mo")) return "ro";
  if(n.startsWith("uk")||n.startsWith("ru")) return "uk";
  if(/^(bs|hr|sr|sh|me)/.test(n)) return "bs";
  return "en";
}

  done:{},log:[],kicks:[],rem:[],diet:{tri:null,pref:"std"},onboarded:false},load());

/* merged translation table: every language inherits German for keys it lacks */
let TM={};
function rebuildT(){ TM={}; LANGS.forEach(([c])=>{ TM[c]=Object.assign({},T.de,T[c]||{}); }); }
rebuildT();
let t=()=>TM[S.lang]||TM.de;
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
const DAY=864e5;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtDate(d){ if(!d)return"—"; return new Date(d).toLocaleDateString(LX(LOCALE)||"de-AT",{day:"2-digit",month:"short",year:"numeric"}); }
function euro(n){ return (S.lang!=="en") ? "€"+n.toLocaleString(LX(LOCALE)||"de-AT",{minimumFractionDigits:2,maximumFractionDigits:2}) : "€"+n.toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2}); }

/* derived pregnancy state */
function dueDate(){ return S.due ? new Date(S.due+"T00:00:00") : null; }
function daysToDue(){ const d=dueDate(); if(!d) return null; return Math.round((d-startOfToday())/DAY); }
function startOfToday(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function currentWeekF(){ const dd=daysToDue(); if(dd===null) return null; return 40-(dd/7); }
function currentWeek(){ const f=currentWeekF(); if(f===null) return null; return Math.max(1,Math.min(42,Math.floor(f)+1)); }
function triOf(w){ return w<=13?1 : w<=27?2 : 3; }
/* date of a given week-from-LMP */
function dateOfWeek(w){ const d=dueDate(); if(!d) return null; return new Date(d.getTime()-(40-w)*7*DAY); }

function go(v){ view=v; $$(".view").forEach(s=>s.classList.add("hide")); $("#v-"+v).classList.remove("hide");
  $$("#tabs .tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v)); window.scrollTo({top:0,behavior:"smooth"}); renderAll(); }

/* ============================== TOOLTIP ============================== */
const tip=$("#tip");
function showTip(e,html){ tip.innerHTML=html; tip.classList.add("on");
  const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-10), y=Math.max(10,e.clientY-tip.offsetHeight-12);
  tip.style.left=x+"px"; tip.style.top=y+"px"; }
function hideTip(){ tip.classList.remove("on"); }

      <button class="btn primary" data-ob="1">${esc(t().setDue)}</button>`;

  }
  const tri=triOf(w), pct=Math.max(0,Math.min(100,((40-dd/7)/40)*100));
  const nm=S.name?esc(S.name):"";
  $("#hero").innerHTML=`
   <div class="ring-wrap">
     ${ring(pct,w)}
     <div style="flex:1;min-width:230px">
       <h1 style="margin-bottom:2px">${esc(t().heroHi)} ${nm}</h1>
       <p class="muted" style="margin:0">${esc(t().heroWeek)} <b style="color:var(--ink-1)">${w}</b> ${esc(t().heroSSW)} · ${esc(t()["tri"+tri])}</p>
     </div>

     <div class="stat"><div class="k">${esc(t().statDays)}</div><div class="v">${dd<0?0:dd}</div><div class="s">${Math.max(0,Math.round(dd/7))} ${esc(t().weeksLeft)}</div></div>
     <div class="stat"><div class="k">${esc(t().statDue)}</div><div class="v" style="font-size:1.15rem;padding-top:8px">${fmtDate(S.due)}</div><div class="s">&nbsp;</div></div>
   </div>`;
}
function ring(pct,w){
  const r=52,c=2*Math.PI*r;
  return `<svg width="130" height="130" viewBox="0 0 130 130" role="img" aria-label="${pct.toFixed(0)}%">
   <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--grid)" stroke-width="11"/>
   <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--brand)" stroke-width="11" stroke-linecap="round"
     stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}" transform="rotate(-90 65 65)"/>
   <text x="65" y="62" text-anchor="middle" font-size="27" font-weight="700" fill="var(--ink-1)">${w}</text>
   <text x="65" y="80" text-anchor="middle" font-size="11" fill="var(--ink-2)">${esc(t().wkAbbr)}</text></svg>`;
}
function upcoming(n){
  if(!S.due) return [];
  const today=startOfToday();
  return TODO.map(o=>({o,d:dateOfWeek(o.w)})).filter(x=>x.d&&x.d>=today&&!S.done[x.o.id])
    .sort((a,b)=>a.d-b.d).slice(0,n);
}
function renderNext(){
  const up=upcoming(4);
  if(!S.due){ $("#cardNext").innerHTML=`<h2>${esc(t().nextTitle)}</h2><p class="muted">${esc(t().noDue)}</p>`; return; }
  $("#cardNext").innerHTML=`<div class="section-head"><h2>${esc(t().nextTitle)}</h2></div>`+
   (up.length?`<ul class="clean">${up.map(({o,d})=>{
     const dl=Math.round((d-startOfToday())/DAY);
     const when = dl===0?t().today : dl===1?t().tomorrow : t().inDays.replace("%d",dl);
     return `<li class="todo"><div class="body"><div class="t">${esc(LX(o)[0])}</div>
       <div class="d">${fmtDate(d)} · ${esc(when)}</div>
       <div class="meta"><a class="src" href="${o.u}" target="_blank" rel="noopener noreferrer" aria-label="${esc(LX(o)[0])} – ${esc(t().pillOfficial)}">${esc(t().pillOfficial)} ↗</a></div></div></li>`;
   }).join("")}</ul>`:`<p class="muted">${esc(t().nextNone)}</p>`);
}
function renderFocus(){
  const w=currentWeek();

  const wd=WEEKS.find(x=>x.w===Math.max(4,Math.min(40,w)))||WEEKS[0];

/* ============================== TIMELINE CHART ============================== */
function renderTimeline(){
  const W=940, PL=104, PR=16, PT=34, laneGap=16, barH=17, rowGap=6;
  const x0=-12, x1=92, sx=v=>PL+((v-x0)/(x1-x0))*(W-PL-PR);
  const lanes=[[],[],[]];
  MS.forEach(m=>{ // greedy row packing per lane
    const rows=lanes[m.lane]; let placed=false;
    for(const row of rows){ if(row[row.length-1].b+3<=m.a){ row.push(m); placed=true; break; } }
    if(!placed) rows.push([m]);
  });
  let y=PT, out="", legendRows=[], laneY=[];
  const laneNames=[t().laneMed,t().laneLaw,t().laneMoney];
  lanes.forEach((rows,li)=>{
    laneY.push(y);
    out+=`<text x="8" y="${y+12}" font-size="12" font-weight="700" fill="var(--ink-1)">${esc(laneNames[li])}</text>`;
    rows.forEach(row=>{
      row.forEach(m=>{
        const bx=sx(m.a), bw=Math.max(6,sx(m.b)-sx(m.a)-2);
        out+=`<g class="msg">`;
        out+=`<rect class="msbar" x="${bx}" y="${y}" width="${bw}" height="${barH}" rx="4" fill="var(--${m.c})"
           stroke="var(--surface-1)" stroke-width="2" data-i="${MS.indexOf(m)}" tabindex="0" role="img"><title>${esc(LX(m))}</title></rect>`;
        if(bw>120){ const cid="cl"+MS.indexOf(m);
          out+=`<clipPath id="${cid}"><rect x="${bx}" y="${y}" width="${bw-8}" height="${barH}"/></clipPath>`;
          out+=`<text clip-path="url(#${cid})" x="${bx+7}" y="${y+12.5}" font-size="10.5" fill="#fff" style="pointer-events:none">${esc(clip(LX(m),Math.floor((bw-14)/5.9)))}</text>`; }
        out+=`</g>`;
      });
      y+=barH+rowGap;
    });
    y+=laneGap;
  });
  const H=y+34;
  // grid + axis
  let grid="";
  const ticks=[-12,0,10,20,30,40,53,66,79,92];
  ticks.forEach(v=>{
    grid+=`<line x1="${sx(v)}" y1="${PT-12}" x2="${sx(v)}" y2="${H-30}" stroke="var(--grid)" stroke-width="1"/>`;
    grid+=`<text x="${sx(v)}" y="${H-14}" font-size="10.5" text-anchor="middle" fill="var(--ink-3)">${axLbl(v)}</text>`;
  });
  grid+=`<line x1="${sx(40)}" y1="${PT-16}" x2="${sx(40)}" y2="${H-30}" stroke="var(--s8)" stroke-width="2" stroke-dasharray="4 3"/>`;
  grid+=`<text x="${sx(40)}" y="${PT-20}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--s8)">${esc(t().birth)}</text>`;
  const cw=currentWeekF();
  if(cw!==null&&cw>=x0&&cw<=x1){
    grid+=`<line x1="${sx(cw)}" y1="${PT-16}" x2="${sx(cw)}" y2="${H-30}" stroke="var(--brand)" stroke-width="2"/>`;
    grid+=`<circle cx="${sx(cw)}" cy="${PT-16}" r="4" fill="var(--brand)"/>`;
    grid+=`<text x="${sx(cw)}" y="${PT-22}" font-size="11" font-weight="700" text-anchor="middle" fill="var(--brand)">${esc(t().todayS)}</text>`;
  }
  const svg=$("#timelineChart");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  svg.setAttribute("aria-label",t().timelineTitle);
  svg.parentElement.style.minWidth="";
  svg.innerHTML=grid+out;
  svg.style.minWidth="700px";
  $$(".msbar",svg).forEach(r=>{
    const m=MS[+r.dataset.i];
    const show=e=>showTip(e,`<b>${esc(LX(m))}</b><span class="tiny">${lbl(m.a)} → ${lbl(m.b)}</span>`);
    r.addEventListener("mousemove",show); r.addEventListener("mouseenter",show);
    r.addEventListener("mouseleave",hideTip); r.addEventListener("focus",e=>{const b=r.getBoundingClientRect();showTip({clientX:b.x+b.width/2,clientY:b.y},`<b>${esc(LX(m))}</b>`)});
    r.addEventListener("blur",hideTip);
    r.style.cursor="pointer";
    r.addEventListener("click",()=>window.open(m.u,"_blank","noopener"));
  });
  // legend by lane colour meaning
  $("#timelineLegend").innerHTML=[["s1",t().legEkp],["s7",t().legUs],
    ["s2",t().legLaw],["s4",t().legDl],
    ["s6",t().legWg],["s3",t().legFam],["s5",t().legAuth],["s8",t().birth]]
    .map(([c,n])=>`<span class="li"><span class="swatch" style="background:var(--${c})"></span>${esc(n)}</span>`).join("");
  // table view
  $("#timelineTable").innerHTML=`<table class="data"><thead><tr><th>${esc(t().rCol1)}</th><th>${esc(t().colPeriod)}</th><th>${esc(t().colArea)}</th></tr></thead><tbody>`+
    MS.map(m=>`<tr><td><a href="${m.u}" target="_blank" rel="noopener noreferrer">${esc(LX(m))}</a></td><td>${lbl(m.a)} → ${lbl(m.b)}</td><td>${esc(laneNames[m.lane])}</td></tr>`).join("")+`</tbody></table>`;
  function clip(s,n){ return s.length>n? s.slice(0,n-1)+"…" : s; }
  function axLbl(v){ if(v<0) return t().axBefore; if(v===40) return t().birth;
    if(v>40) return "+"+Math.round((v-40)/4.345)+t().axMonShort; return t().weekOf+" "+v; }
  function lbl(v){ if(v<0) return t().weeksBefore.replace("%d",-v);
    if(v<=40) return t().weekOf+" "+v; return t().monthsAfter.replace("%d",Math.round((v-40)/4.345)); }
}

/* ============================== GROWTH (small multiples, never dual axis) ============================== */
function renderGrowth(){
  const W=460,H=280,P={t:24,r:14,b:34,l:44},fh=(H-24)/2;
  const facets=[{key:"l",lbl:t().growthLen,col:"s1",fmt:v=>v+" cm"},{key:"g",lbl:t().growthWt,col:"s2",fmt:v=>v+" g"}];
  let out="";
  facets.forEach((f,fi)=>{
    const oy=fi*(fh+18), max=Math.max(...WEEKS.map(d=>d[f.key]))*1.08;
    const sx=w=>P.l+((w-4)/36)*(W-P.l-P.r), sy=v=>oy+P.t+fh-P.t-8-((v/max)*(fh-P.t-8));
    out+=`<text x="0" y="${oy+12}" font-size="12" font-weight="700" fill="var(--ink-1)">${esc(f.lbl)}</text>`;
    [0,.5,1].forEach(k=>{ const yy=sy(max*k);
      out+=`<line x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}" stroke="var(--grid)"/>
            <text x="${P.l-6}" y="${yy+3.5}" font-size="10" text-anchor="end" fill="var(--ink-3)">${Math.round(max*k)}</text>`;});
    const pts=WEEKS.map(d=>[sx(d.w),sy(d[f.key])]);
    out+=`<path d="M${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join("L")}" fill="none" stroke="var(--${f.col})" stroke-width="2" stroke-linejoin="round"/>`;
    const cw=currentWeek();
    if(cw&&cw>=4&&cw<=40){ const d=WEEKS.find(x=>x.w===cw);
      out+=`<circle cx="${sx(cw)}" cy="${sy(d[f.key])}" r="5" fill="var(--${f.col})" stroke="var(--surface-1)" stroke-width="2"/>
            <text x="${sx(cw)}" y="${sy(d[f.key])-10}" font-size="10.5" font-weight="700" text-anchor="middle" fill="var(--ink-1)">${f.fmt(d[f.key])}</text>`;}
    if(fi===1) [4,10,16,22,28,34,40].forEach(w=>out+=`<text x="${sx(w)}" y="${oy+fh+8}" font-size="10" text-anchor="middle" fill="var(--ink-3)">${w}</text>`);
  });
  const svg=$("#growthChart"); svg.setAttribute("viewBox",`0 0 ${W} ${H+16}`); svg.innerHTML=out;
  svg.setAttribute("aria-label",t().growthTitle);
  $("#growthLegend").innerHTML=`<span class="li"><span class="swatch" style="background:var(--s1)"></span>${esc(t().growthLen)}</span>
    <span class="li"><span class="swatch" style="background:var(--s2)"></span>${esc(t().growthWt)}</span>
    <span class="li tiny">${esc(t().growthNote)}</span>`;
}
