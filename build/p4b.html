   <p>Doğum tarihi, eyalet, tamamlanan görevler, kilo, tansiyon, bebek hareketleri, hatırlatmalar ve beslenme ayarları yalnızca tarayıcının yerel belleğinde durur. Hiçbir zaman iletilmez. Tarayıcı verilerini silersen kaybolurlar – dışa aktarma bu yüzden var.</p>

   <p><b>Ukratko:</b> ova stranica nema server koji čuva vaše unose. Bez naloga, bez registracije, bez kolačića, bez skripti za praćenje.</p>
   <h3>Šta ostaje na vašem uređaju</h3>
   <p>Termin poroda, pokrajina, završeni zadaci, težina, krvni pritisak, pokreti bebe, podsjetnici i postavke ishrane nalaze se isključivo u lokalnoj memoriji vašeg preglednika. Nikada se ne prenose. Ako obrišete podatke preglednika, nestaju – zato postoji izvoz.</p>
   <h3>Šta iskreno ne možemo spriječiti</h3>
   <p>Svaki web-server pri otvaranju vidi tehničke podatke pristupa poput IP adrese i vrste preglednika – to važi za svaku stranicu na internetu. Ono što garantujemo: ništa što ovdje ukucate ne napušta vaš uređaj. Opcionalno se koristi brojanje posjeta bez kolačića i isključivo zbirno (bez ličnih podataka). Zato ovdje nema ni obavještenja o kolačićima.</p>
   <h3>Zašto nema pravih push-obavještenja</h3>
   <p>Push bi zahtijevao server i identifikator uređaja. Umjesto toga: izvoz u kalendar (.ics) i lokalna obavještenja preglednika. Vaši termini završavaju u vašem kalendaru – ne u našoj bazi.</p>
   <h3>Sigurnost ove stranice</h3>
   <p>Stranica ne učitava strane skripte, fontove ni slike. Stroga Content Security Policy dozvoljava samo kod isporučen s ovom datotekom – ubačeni strani kod preglednik blokira.</p>
   <h3>Medicinska napomena</h3>
   <p>Svi sadržaji su opće informacije zasnovane na javno dostupnim zvaničnim izvorima. Ne zamjenjuju pregled, dijagnozu ni savjet ljekara ili babice. U hitnom slučaju: 144.</p>`

 privHtml:`
   <p><b>Коротко:</b> у цього сайту немає сервера, який зберігає ваші записи. Без облікового запису, без реєстрації, без файлів cookie, без скриптів стеження.</p>
   <h3>Що залишається на вашому пристрої</h3>
   <p>Дата пологів, федеральна земля, виконані справи, вага, тиск, рухи дитини, нагадування та налаштування харчування зберігаються виключно в локальній пам'яті вашого браузера. Вони ніколи не передаються. Якщо очистити дані браузера, вони зникнуть – саме тому існує експорт.</p>
   <h3>Чого ми, чесно кажучи, не можемо уникнути</h3>
   <p>Будь-який вебхостинг під час відкриття сторінки бачить технічні дані доступу, як-от IP-адресу і тип браузера – це стосується кожного сайту в інтернеті. Що ми гарантуємо: нічого з того, що ви тут вводите, не залишає ваш пристрій. За бажанням використовується статистика без файлів cookie, суто узагальнена (лише перегляди сторінок, без персональних даних). Тому тут немає і банера про cookie.</p>
   <h3>Чому немає справжніх push-сповіщень</h3>
   <p>Push потребував би сервера та ідентифікатора пристрою. Натомість: експорт у календар (.ics) і локальні сповіщення браузера. Ваші візити потрапляють у ваш календар – а не в нашу базу даних.</p>
   <h3>Безпека цієї сторінки</h3>
   <p>Сторінка не завантажує сторонніх скриптів, шрифтів чи зображень. Сувора Content Security Policy дозволяє лише той код, що постачається разом із цим файлом – впроваджений сторонній код блокується браузером.</p>

   <p>Увесь вміст є загальною інформацією на основі публічно доступних офіційних джерел. Він не замінює обстеження, діагностику чи консультацію лікаря або акушерки. У невідкладному випадку: 144.</p>`

Object.keys(PACK).forEach(code=>{
  const P=PACK[code]||{};
  T[code]=Object.assign({},T.de,P.ui||{});
  if(P.weeks) WEEKS.forEach((w,i)=>{ if(P.weeks[i]) w[code]=P.weeks[i]; });
  if(P.ms)    MS.forEach((m,i)=>{ if(P.ms[i]) m[code]=P.ms[i]; });
  if(P.todo)  TODO.forEach(o=>{ if(P.todo[o.id]) o[code]=P.todo[o.id]; });
  if(P.diet)  [1,2,3].forEach(k=>{ const s=P.diet[k]; if(!s) return;
    DIET[k].kcal[code]=s.kcal; DIET[k].eat[code]=s.eat; DIET[k].avoid[code]=s.avoid; });
  if(P.day)   Object.keys(P.day).forEach(k=>{ if(DIETDAY[k]) DIETDAY[k][code]=P.day[k]; });
  if(P.pref)  DIETPREF.forEach(([k,n])=>{ if(P.pref[k]) n[code]=P.pref[k]; });
  if(P.rates) RATES.forEach((r,i)=>{ if(P.rates[i]) r[0][code]=P.rates[i]; });
