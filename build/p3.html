   <p><b>Kurz gesagt:</b> Diese Seite hat keinen Server, der deine Eingaben speichert. Kein Konto, keine Anmeldung, keine Cookies, kein Tracking-Skript.</p>
   <h3>Was auf deinem Gerät bleibt</h3>
   <p>Geburtstermin, Bundesland, erledigte To-dos, Gewicht, Blutdruck, Kindsbewegungen, Erinnerungen und Ernährungseinstellungen liegen ausschließlich im lokalen Speicher deines Browsers. Sie werden nie übertragen. Löschst du deine Browserdaten, sind sie weg – deshalb gibt es den Export.</p>
   <h3>Was wir ehrlicherweise nicht verhindern können</h3>
   <p>Jeder Webhost sieht beim Aufruf technische Zugriffsdaten wie IP-Adresse und Browsertyp – das gilt für jede Website im Internet. Was wir zusichern: Nichts, was du hier eintippst, verlässt dein Gerät. Optional wird eine cookielose, rein aggregierte Statistik (nur Seitenaufrufe, keine personenbezogenen Daten) verwendet. Deshalb gibt es hier auch kein Cookie-Banner.</p>
   <h3>Warum keine echten Push-Nachrichten</h3>
   <p>Push würde einen Server und eine Geräte-ID erfordern. Stattdessen: Kalender-Export (.ics) und lokale Browser-Benachrichtigungen. Deine Termine landen in deinem Kalender – nicht in unserer Datenbank.</p>
   <h3>Sicherheit dieser Seite</h3>
   <p>Die Seite lädt keine fremden Skripte, Schriften oder Bilder nach. Eine strenge Content-Security-Policy erlaubt ausschließlich den Code, der mit dieser Datei ausgeliefert wurde – eingeschleuster Fremdcode wird vom Browser blockiert.</p>

   <p>Alle Inhalte sind allgemeine Informationen auf Basis öffentlich zugänglicher offizieller Quellen. Sie ersetzen keine Untersuchung, Diagnose oder Beratung durch Ärztin, Arzt oder Hebamme. Im Notfall: 144.</p>`,

   <p><b>In short:</b> this site has no server that stores what you enter. No account, no sign-up, no cookies, no tracking script.</p>
   <h3>What stays on your device</h3>
   <p>Due date, federal state, completed to-dos, weight, blood pressure, kick counts, reminders and nutrition settings live only in your browser's local storage. They are never transmitted. If you clear your browser data they are gone — which is why the export exists.</p>
   <h3>What we honestly cannot prevent</h3>
