vještenja preglednika. Vaši termini završavaju u vašem kalendaru – ne u našoj bazi.</p>\n   <h3>Sigurnost ove stranice</h3>\n   <p>Stranica ne učitava strane skripte, fontove ni slike. Stroga Content Security Policy dozvoljava samo kod isporučen s ovom datotekom – ubačeni strani kod preglednik blokira.</p>\n   <h3>Medicinska napomena</h3>\n   <p>Svi sadržaji su opće informacije zasnovane na javno dostupnim zvaničnim izvorima. Ne zamjenjuju pregled, dijagnozu ni savjet ljekara ili babice. U hitnom slučaju: 144.</p>"},weeks:["Zrno maka","Sjeme sezama","Leća","Borovnica","Malina","Grožđe","Jagoda","Smokva","Kajsija","Limun","Breskva","Jabuka","Avokado","Kruška","Paprika","Paradajz","Banana","Šargarepa","Tikvica","Mango","Patlidžan","Keleraba","Dinja","Karfiol","Veliki patlidžan","Buttern bundeva","Glavica kupusa","Kokos","Struk celera","Ananas","Kantalup dinja","Medena dinja","Zelena salata","Blitva","Praziluk","Mala lubenica","Bundeva"],ms:["Folna kiselina 400 µg dnevno – idealno 4 sedmice prije začeća","Provjeriti imunitet (rubeola, vodene kozice), pregled kod stomatologa","1. Eltern-Kind-Pass pregled – do kraja 16. sedmice","1. ultrazvuk (8–12. sedmica)","2. Eltern-Kind-Pass pregled (17–20. sedmica)","2. ultrazvuk + razgovor s babicom (18–22. sedmica)","3. EKP pregled uključujući test opterećenja glukozom (25–28. sedmica)","4. EKP pregled (30–34. sedmica)","3. ultrazvuk (30–34. sedmica)","5. EKP pregled (35–38. sedmica)","Porod (očekivani termin)","Eltern-Kind-Pass pregledi djeteta","Prijaviti trudnoću poslodavcu – tek tada vrijedi zaštita od otkaza","Odabrati i prijaviti bolnicu / babicu, tečaj pripreme za porod","Mutterschutz: apsolutna zabrana rada 8 sedmica prije termina","Mutterschutz nakon poroda: 8 sedmica (12 kod carskog reza/blizanaca/prijevremenog poroda)","Rodni list, prijava prebivališta, e-card za dijete","Karenz – prijaviti najkasnije na kraju Mutterschutza","Wochengeld (ÖGK) – 8 sedmica prije do 8 sedmica poslije poroda","Familienzeitbonus za drugog r ity Policy strictă permite exclusiv codul livrat împreună cu acest fișier – codul străin injectat este blocat de browser.</p>\n   <h3>Mențiune medicală</h3>\n   <p>Toate conținuturile sunt informații generale bazate pe surse oficiale publice. Ele nu înlocuiesc examinarea, diagnosticul sau consultanța medicului ori a moașei. În caz de urgență: 144.</p>"},weeks:["Sămânță de mac","Sămânță de susan","Linte","Afină","Zmeură","Boabă de strugure","Căpșună","Smochină","Caisă","Lămâie","Piersică","Măr","Avocado","Pară","Ardei gras","Roșie","Banană","Morcov","Dovlecel","Mango","Vânătă","Gulie","Pepene galben","Conopidă","Vânătă mare","Dovleac butternut","Căpățână de varză","Nucă de cocos","Legătură de țelină","Ananas","Pepene cantalup","Pepene galben mare","Salată verde","Mangold","Praz","Pepene mic","Dovleac"],ms:["Acid folic 400 µg zilnic – ideal cu 4 săptămâni înainte de concepție","Verifică imunitatea (rubeolă, varicelă), control stomatologic","Prima examinare Eltern-Kind-Pass – până la sfârșitul săptămânii 16","Prima ecografie (săptămânile 8–12)","A doua examinare Eltern-Kind-Pass (săptămânile 17–20)","A doua ecografie + discuție cu moașa (săptămânile 18–22)","A treia examinare EKP, inclusiv testul de toleranță la glucoză (săptămânile 25–28)","A patra examinare EKP (săptămânile 30–34)","A treia ecografie (săptămânile 30–34)","A cincea examinare EKP (săptămânile 35–38)","Nașterea (termen estimat)","Examinările Eltern-Kind-Pass ale copilului","Anunță sarcina angajatorului – abia atunci se aplică protecția împotriva concedierii","Alege și înscrie-te la spital / moașă, curs de pregătire pentru naștere","Mutterschutz: interdicție absolută de muncă cu 8 săptămâni înainte de termen","Mutterschutz după naștere: 8 săptămâni (12 la cezariană/sarcină multiplă/naștere prematură)","Certificat de naștere, înregistrarea domiciliului, e-card pentru copil","Karenz – anunță cel târziu la sfârșitul Mutterschutz","Wochengeld (ÖGK) – cu 8 săptămâni înainte până la 8 săptămâni după naștere"," ар (.ics)",chanCalD:"Найнадійніше: усі візити переходять у ваш календар і нагадують навіть тоді, коли цю сторінку закрито. Працює офлайн і на будь-якому пристрої.",chanBrowT:"Сповіщення браузера",chanBrowD:"Нагадування за два дні до візиту – поки цей браузер працює, а сторінка відкрита або встановлена як застосунок.",chanAppT:"Встановити як застосунок",chanAppD:'У меню браузера оберіть "Додати на головний екран". Тоді сторінка поводиться як застосунок, і сповіщення надходять значно надійніше.',chanRec:"рекомендовано",remSaved:"Нагадування збережено.",remRemoved:"Нагадування видалено.",expOk:"Дані експортовано. Зберігайте файл у безпеці – він містить ваші записи.",impOk:"Дані імпортовано.",impErr:"Не вдалося прочитати файл. Оберіть файл експорту цього сайту.",delOk:"Усі дані на цьому пристрої видалено.",privHtml:"\n   <p><b>Коротко:</b> у цього сайту немає сервера, який зберігає ваші записи. Без облікового запису, без реєстрації, без файлів cookie, без скриптів стеження.</p>\n   <h3>Що залишається на вашому пристрої</h3>\n   <p>Дата пологів, федеральна земля, виконані справи, вага, тиск, рухи дитини, нагадування та налаштування харчування зберігаються виключно в локальній пам'яті вашого браузера. Вони ніколи не передаються. Якщо очистити дані браузера, вони зникнуть – саме тому існує експорт.</p>\n   <h3>Чого ми, чесно кажучи, не можемо уникнути</h3>\n   <p>Будь-який вебхостинг під час відкриття сторінки бачить технічні дані доступу, як-от IP-адресу і тип браузера – це стосується кожного сайту в інтернеті. Що ми гарантуємо: нічого з того, що ви тут вводите, не залишає ваш пристрій. За бажанням використовується статистика без файлів cookie, суто узагальнена (лише перегляди сторінок, без персональних даних). Тому тут немає і банера про cookie.</p>\n   <h3>Чому немає справжніх push-сповіщень</h3>\n   <p>Push потребував би сервера та ідентифікатора пристрою. Натомість: експорт у календар (.ics) і локальні сповіщення браузера. Ваші візити потрапляють у ваш календар – а не в нашу базу даних.</p>\n   <h3>Безпека цієї сторінки</h3>\n   <p>Сторінка не завантажує сторонніх скриптів, шрифтів чи зображень. Сувора Content Security Policy дозволяє лише той код, що постачається разом із цим файлом – впроваджений сторонній код блокується браузером.</p>\n   <h3>Медичне застереження</h3>\n   <p>Увесь вміст є загальною інформацією на основі публічно доступних офіційних джерел. Він не замінює обстеження, діагностику чи консультацію лікаря або акушерки. У невідкладному випадку: 144.</p>"},weeks:["Макове зернятко","Кунжутне зернятко","Сочевиця","Чорниця","Малина","Виноградина","Полуниця","Інжир","Абрикоса","Лимон","Персик","Яблуко","Авокадо","Груша","Солодкий перець","Помідор","Банан","Морква","Кабачок","Манго","Баклажан","Кольрабі","Диня","Цвітна капуста","Великий баклажан","Гарбуз баттернат","Качан капусти","Кокос","Пучок селери","Ананас","Диня канталупа","Медова диня","Салат ромен","Мангольд","Порей","Маленький кавун","Гарбуз"],ms:["Фолієва кислота 400 мкг щодня – в ідеалі за 4 тижні до зачаття","Перевірити імунітет (краснуха, вітряна віспа), візит до стоматолога","1-ше обстеження Eltern-Kind-Pass – до кінця 16-го тижня","1-ше УЗД (8–12-й тиждень)","2-ге обстеження Eltern-Kind-Pass (17–20-й тиждень)","2-ге УЗД + розмова з акушеркою (18–22-й тиждень)","3-тє обстеження EKP, включно з тестом на глюкозу (25–28-й тиждень)","4-те обстеження EKP (30–34-й тиждень)","3-тє УЗД (30–34-й тиждень)","5-те обстеження EKP (35–38-й тиждень)","Пологи (очікувана дата)","Обстеження дитини за Eltern-Kind-Pass","Повідомити роботодавця про вагітність – лише тоді діє захист від звільнення","Обрати лікарню / акушерку та записатися, курс підготовки до пологів","Mutterschutz: абсолютна заборона працювати за 8 тижнів до дати пологів","Mutterschutz після пологів: 8 тижнів (12 при кесаревому розтині/багатоплідній/передчасних пологах)","Свідоцтво про народження, реєстрація місця проживання, e-card для дитини","Karenz – повідомити щонайпізніше наприкінці Mutterschutz","Wochenge
